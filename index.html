<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04070c">
<title>哈气 · Mistpane</title>
<meta name="description" content="对着冬天的窗哈一口气，用手指在水雾上写字。六张安静的风景，雨雪、车窗、火车窗、渡轮窗与飞机舷窗。">
<link rel="icon" href="data:,">
<link rel="preload" href="assets/photos/fog-house.jpg" as="image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="glass" role="img" aria-label="结雾的玻璃窗，可以用手指擦开"></canvas>
  <canvas id="flat" hidden role="img" aria-label="结雾的玻璃窗，可以用手指擦开"></canvas>
  <canvas id="windowFrame" aria-hidden="true"></canvas>
  <div id="hint" aria-hidden="true">呼气，让玻璃起雾<b>按住画面 / 空格呼气 · 手指在雾上写字画画</b><b>底部按钮更换背景、随机天气 · 双击画面也可换天气</b></div>
  <div id="label" aria-hidden="true"></div>
  <div id="melt" role="group" aria-label="雾气消散速度">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg>
    <button type="button" class="seg" aria-label="慢速消散">慢</button>
    <button type="button" class="seg on" aria-label="中等消散">中</button>
    <button type="button" class="seg" aria-label="快速消散">快</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<div id="dock">
  <button type="button" class="btn off" id="btnMic" aria-label="麦克风呼气" title="麦克风呼气（M）">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3"></rect>
      <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"></path>
      <path d="M12 18v3"></path>
      <path d="M8.5 21h7"></path>
      <path class="slash" d="M4 4l16 16"></path>
    </svg>
  </button>
  <button type="button" class="btn" id="btnScene" aria-label="切换场景" title="切换场景">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4.5" width="18" height="15" rx="2"></rect>
      <circle cx="8.5" cy="9.5" r="1.6"></circle>
      <path d="M3.5 16.6l4.7-4.3 3.5 3.1 3-2.5 5.8 4.6"></path>
    </svg>
  </button>
  <button type="button" class="btn" id="btnWeather" aria-label="随机天气" title="随机天气（双击画面也可）">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
      <path d="M8.4 21.6l-.9 1.9"></path>
      <path d="M12.2 21.6l-.9 1.9"></path>
      <path d="M16 21.6l-.9 1.9"></path>
    </svg>
  </button>
  <button type="button" class="btn" id="btnWindow" aria-label="切换窗户样式" title="切换窗户：车窗 / 火车窗 / 渡轮方窗 / 飞机舷窗">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="5" width="17" height="14" rx="2.5"></rect>
      <rect x="6.8" y="8.2" width="10.4" height="7.6" rx="1.6"></rect>
    </svg>
  </button>
  <button type="button" class="btn" id="btnUpload" aria-label="上传照片作为背景" title="上传照片作为背景">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 15.5V4"></path>
      <path d="M7.6 8.4L12 4l4.4 4.4"></path>
      <path d="M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"></path>
    </svg>
  </button>
</div>

<input type="file" id="file" accept="image/*" tabindex="-1" aria-hidden="true">

<script src="js/windows.js"></script>
<script src="js/app.js"></script>
</body>
</html>
