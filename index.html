<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9e7e0">
<title>哈气 · Mistpane</title>
<meta name="description" content="对着冬天的窗哈一口气，用手指在水雾上写字。八张旅行照片，雾气写字与可以拖动遮光板的飞机舷窗。">
<link rel="icon" href="data:,">
<link rel="preload" href="assets/photos/cloud-dusk.jpg" as="image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="glass" role="img" aria-label="结雾的玻璃窗，可以用手指擦开"></canvas>
  <canvas id="flat" hidden role="img" aria-label="结雾的玻璃窗，可以用手指擦开"></canvas>
  <canvas id="windowShade" hidden aria-hidden="true"></canvas>
  <canvas id="windowFrame" aria-hidden="true"></canvas>
  <div id="cabinAmbient" aria-hidden="true"></div>
  <button id="shadeHandle" type="button" role="slider" aria-label="舷窗遮光板，拖动开合；方向键调节" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-orientation="vertical" hidden><span></span></button>
  <div id="hint" aria-hidden="true">按住哈气 · 松开写字<b>也可打开麦克风，轻轻哈气</b></div>
  <div id="label" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<div id="controls" aria-label="玻璃窗操作">
  <div id="breathBar">
    <button id="btnBreath" type="button" aria-label="按住哈气，松开后在玻璃上写字">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h12c4 0 4-5 1-5-2 0-3 1-3 2M3 12h16c4 0 4 5 1 5M3 16h8c4 0 4 5 1 5"></path></svg>
      <span>按住哈气</span>
    </button>
    <button id="btnMic" type="button" aria-pressed="false" aria-label="开启麦克风哈气" title="麦克风哈气（M）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7"></path></svg>
      <span>麦克风</span><i aria-hidden="true"></i>
    </button>
  </div>
  <div id="dock" role="group" aria-label="背景与环境">
    <button type="button" class="btn" id="btnScene" aria-label="切换下一张照片" title="下一张照片（C）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2"></rect><circle cx="8.5" cy="9.5" r="1.6"></circle><path d="M3.5 16.6l4.7-4.3 3.5 3.1 3-2.5 5.8 4.6"></path></svg><span>照片</span>
    </button>
    <button type="button" class="btn" id="btnWeather" aria-label="切换天气，当前：晴" title="晴 / 小雨 / 大雨 / 雪">
      <svg viewBox="0 0 24 24" aria-hidden="true"></svg><span>晴</span>
    </button>
    <button type="button" class="btn" id="btnWindow" aria-label="切换窗型" title="飞机舷窗 / 火车窗 / 无框玻璃">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"></rect><rect x="6.8" y="8.2" width="10.4" height="7.6" rx="1.6"></rect></svg><span>窗型</span>
    </button>
    <button type="button" class="btn" id="btnMelt" aria-label="切换消散速度，当前：中" title="消散：慢 / 中 / 快">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0zM11.5 10v7"></path></svg><span>消散·中</span>
    </button>
    <button type="button" class="btn" id="btnUpload" aria-label="上传照片作为背景" title="上传自己的照片">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4M7.6 8.4L12 4l4.4 4.4M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"></path></svg><span>上传</span>
    </button>
  </div>
</div>

<input type="file" id="file" accept="image/*" tabindex="-1" aria-hidden="true">

<script src="js/windows.js"></script>
<script src="js/app.js"></script>
</body>
</html>
